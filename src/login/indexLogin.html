<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDICAMENTOS - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background-decoration">
        <div class="decoration-circle" style="top: -5%; left: -5%; width: 300px; height: 300px; background: rgba(37, 99, 235, 0.1); border-radius: 50%;"></div>
        <div class="decoration-circle" style="bottom: -10%; right: -5%; width: 400px; height: 400px; background: rgba(16, 185, 129, 0.08); border-radius: 50%;"></div>
    </div>
    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 3H6C4.89543 3 4 3.89543 4 5V14C4 15.1046 4.89543 16 6 16H8L6 19H8L10 16H14L16 19H18L16 16H18C19.1046 16 20 15.1046 20 14V5C20 3.89543 19.1046 3 18 3Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="7" cy="20" r="2" stroke="#ffffff" stroke-width="2"/>
                    <circle cx="17" cy="20" r="2" stroke="#ffffff" stroke-width="2"/>
                    <line x1="10" y1="7" x2="14" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                    <line x1="12" y1="5" x2="12" y2="9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>MediReserva</h1>
            <p>Tu plataforma de reserva de medicamentos</p>
        </div>

        <div class="login-card">
            <div class="user-type-toggle">
                <button type="button" class="toggle-btn active" data-type="user">Usuario</button>
                <button type="button" class="toggle-btn" data-type="admin">Administrador</button>
            </div>

            <form action="#" method="post" class="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="demo-note" id="admin-note" style="display: none;">
                    Demo: admin@medireserva.com / admin123
                </div>

                <button type="button" class="forgot-link">¿Olvidaste tu contraseña?</button>

                <button type="submit" class="login-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 3H21V21H3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10 14L21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 3H21V8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Iniciar sesión
                </button>

                <div class="divider">
                    <span>O continúa con</span>
                </div>

                <button type="button" class="google-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continuar con Google
                </button>
            </form>

            <p class="register-link">
                ¿No tienes cuenta? <a href="../registro/registro.html">Regístrate</a>
            </p>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
